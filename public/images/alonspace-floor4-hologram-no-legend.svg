<?xml version="1.0" encoding="UTF-8"?>
<svg id="alonspace-floor4-isometric" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 760" role="img" aria-label="AlonSpace isometric office map" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10131c"/><stop offset="100%" stop-color="#05070d"/></linearGradient>
    <linearGradient id="floorTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffaf0"/><stop offset="100%" stop-color="#e9deca"/></linearGradient>
    <linearGradient id="availableTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eff8dc"/><stop offset="100%" stop-color="#bdd89b"/></linearGradient>
    <linearGradient id="reservedTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe6a3"/><stop offset="100%" stop-color="#d9a037"/></linearGradient>
    <linearGradient id="takenTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d6d5cf"/><stop offset="100%" stop-color="#8e8b83"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="goldGlow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f2c14e" flood-opacity=".85"/><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    
    <pattern id="scanPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <rect y="0" width="8" height="1" fill="#7df4ff"/>
    </pattern>

    <style>
      .stage {
        fill:#050914;
      }

      .floor-base {
        fill:rgba(24, 214, 255, .035);
        stroke:rgba(114, 236, 255, .55);
        stroke-width:2.5;
        stroke-linejoin:round;
        filter:drop-shadow(0 0 18px rgba(32,213,255,.24));
      }

      .office {
        cursor:pointer;
        transition:filter .18s ease, transform .18s ease, opacity .18s ease;
        transform-box:fill-box;
        transform-origin:center;
      }

      .office:hover,
      .office.selected {
        filter:drop-shadow(0 0 18px rgba(74,225,255,.95)) drop-shadow(0 0 42px rgba(74,225,255,.38));
        transform:translateY(-8px) scale(1.02);
      }

      .iso-top {
        fill:rgba(37, 226, 255, .07);
        stroke:rgba(128, 241, 255, .9);
        stroke-width:2.2;
        stroke-linejoin:round;
      }

      .iso-side,
      .iso-depth {
        fill:rgba(21, 142, 180, .11);
        stroke:rgba(70, 218, 255, .46);
        stroke-width:1.8;
        stroke-linejoin:round;
      }

      .office:hover .iso-top,
      .office.selected .iso-top {
        fill:rgba(74, 225, 255, .18);
        stroke:#dffcff;
        stroke-width:3;
      }

      .office:hover .iso-side,
      .office:hover .iso-depth,
      .office.selected .iso-side,
      .office.selected .iso-depth {
        fill:rgba(74, 225, 255, .13);
        stroke:rgba(214,252,255,.75);
      }

      .room-num {
        pointer-events:none;
        font:800 24px Arial, sans-serif;
        fill:#dffcff;
        text-anchor:middle;
        dominant-baseline:middle;
        opacity:.92;
        filter:drop-shadow(0 0 7px rgba(74,225,255,.85));
      }

      .service {
        fill:rgba(150, 245, 255, .05);
        stroke:rgba(128, 241, 255, .55);
        stroke-width:2;
        stroke-linejoin:round;
        filter:drop-shadow(0 0 12px rgba(32,213,255,.18));
      }

      .service-text {
        pointer-events:none;
        font:800 18px Arial, sans-serif;
        fill:#c8fbff;
        text-anchor:middle;
        dominant-baseline:middle;
        opacity:.84;
      }

      .legend-text {
        font:700 16px Arial, sans-serif;
        fill:#c8fbff;
      }

      .scanline {
        opacity:.16;
        pointer-events:none;
      }

      .grid-line {
        stroke:rgba(74,225,255,.09);
        stroke-width:1;
      }
      .office.available .top{
    fill:rgba(74,225,255,.08);
}

.office.reserved .top{
    fill:rgba(255,180,40,.18);
    stroke:#ffd24a;
}

.office.taken .top{
    fill:rgba(255,70,70,.16);
    stroke:#ff6666;
    opacity:.75;
}

.office.disabled .top{
    fill:rgba(120,120,120,.12);
    stroke:#777;
    opacity:.45;
}

.office.available .top,
.office.available .iso-top {
  stroke: rgba(128, 241, 255, .95) !important;
  fill: rgba(37, 226, 255, .07) !important;
}

.office.reserved .top,
.office.reserved .iso-top {
  stroke: #ffd15c !important;
  fill: rgba(255, 190, 70, .22) !important;
}

.office.taken .top,
.office.taken .iso-top {
  stroke: #ff6b6b !important;
  fill: rgba(255, 80, 80, .22) !important;
}

.office.disabled .top,
.office.disabled .iso-top {
  stroke: #777 !important;
  fill: rgba(120, 120, 120, .14) !important;
  opacity: .45;
}
    </style>
