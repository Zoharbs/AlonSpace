<?xml version="1.0" encoding="UTF-8"?>

<svg
  id="alonspace-floor6-clean"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 760"
  role="img"
  aria-label="AlonSpace floor 6 editable hologram map"
>
  <defs>
    <style>
      .stage {
        fill: #050914;
      }

      .office {
        cursor: pointer;
        transition: filter .18s ease, transform .18s ease;
        transform-box: fill-box;
        transform-origin: center;
      }

      .office:hover,
      .office.selected {
        filter:
          drop-shadow(0 0 16px rgba(74, 225, 255, .95))
          drop-shadow(0 0 34px rgba(74, 225, 255, .35));

        transform: translateY(-6px) scale(1.015);
      }

      .top {
        fill: rgba(37, 226, 255, .07);
        stroke: rgba(128, 241, 255, .92);
        stroke-width: 2.2;
        stroke-linejoin: round;
      }

      .depth {
        fill: rgba(21, 142, 180, .12);
        stroke: rgba(70, 218, 255, .48);
        stroke-width: 1.8;
        stroke-linejoin: round;
      }

      .office:hover .top,
      .office.selected .top {
        fill: rgba(74, 225, 255, .18);
        stroke: #dffcff;
        stroke-width: 3;
      }

      .office:hover .depth,
      .office.selected .depth {
        fill: rgba(74, 225, 255, .14);
        stroke: rgba(214, 252, 255, .75);
      }

      .num {
        pointer-events: none;
        font: 800 26px Arial, sans-serif;
        fill: #dffcff;
        text-anchor: middle;
        dominant-baseline: middle;
        opacity: .94;
        filter: drop-shadow(0 0 7px rgba(74, 225, 255, .85));
      }

      .facility {
        fill: rgba(150, 245, 255, .05);
        stroke: rgba(128, 241, 255, .55);
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .facility-text {
        pointer-events: none;
        font: 800 18px Arial, sans-serif;
        fill: #c8fbff;
        text-anchor: middle;
        dominant-baseline: middle;
        opacity: .88;
      }

      /* סטטוסים שמגיעים מהאתר */

      .office.available .top {
        fill: rgba(37, 226, 255, .07);
        stroke: rgba(128, 241, 255, .95);
      }

      .office.reserved .top {
        fill: rgba(255, 190, 70, .22);
        stroke: #ffd15c;
      }

      .office.taken .top {
        fill: rgba(255, 80, 80, .22);
        stroke: #ff6b6b;
        opacity: .76;
      }

      .office.disabled .top {
        fill: rgba(120, 120, 120, .14);
        stroke: #777;
        opacity: .45;
      }
    </style>
  </defs>

